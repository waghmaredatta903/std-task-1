<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STUDENT CRUD</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<style>
    body {
    background: linear-gradient(135deg, #f97316, #ec4899);
    min-height: 100vh;
}

.spinner {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.spinner-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    padding: 30px 40px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
}

.spinner-border {
    width: 55px;
    height: 55px;
    border-width: 5px;
    color: #ec4899;
}

.spinner-text {
    font-size: 16px;
    font-weight: 600;
    color: #444;
    letter-spacing: 0.5px;
}
.card{
    border-radius: 5%;
}
.col-md-8{
    border-radius: 5%;
}
</style>

<body>

    <div class="container-fluid mt-5">
        <h1>Student Information</h1>
        <div class="row">
            <div class="col-md-4 mb-4 mb-md-0">
                <div class="card">
                    <div class="card-body">
                        <form id="stdForm">
                            <div class="form-group">
                                <label for="fname">
                                    Type First Name
                                    <span>*</span>
                                </label>
                                <input required type="text" class="form-control" id="fname">
                            </div>
                            <div class="form-group">
                                <label for="lname">
                                    Type Last Name
                                    <span>*</span>
                                </label>
                                <input required type="text" class="form-control" id="lname">
                            </div>
                            <div class="form-group">
                                <label for="contact">
                                    Type Contact Number
                                    <span>*</span>
                                </label>
                                <input required type="text" class="form-control" id="contact">
                            </div>
                            <div class="form-group">
                                <label for="email">
                                    Type Email ID
                                    <span>*</span>
                                </label>
                                <input required type="email" class="form-control" id="email">
                            </div>
                            <button type="submit" class="btn btn-sm btn-block btn-primary" id="addBtn">
                                Add Student
                            </button>
                            <button type="button" class="btn btn-sm btn-block btn-success d-none" id="updateBtn">
                                Update Student Info
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="table-responsive">
                    <table class="table table-bordered table-dark">
                        <thead>
                            <tr>
                                <th>Sr.No</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Contact No.</th>
                                <th>Email</th>
                                <th>Edit</th>
                                <th>Remove</th>
                            </tr>
                        </thead>
                        <tbody id="stdList">
                            <tr id="124">
                                <td>1</td>
                                <td>Mahesh</td>
                                <td>Gangapure</td>
                                <td>7050002211</td>
                                <td>mahesh121@gmail.com</td>
                                <td>
                                    <i onclick="onEditStd(this)"
                                        class="fa-solid fa-pen-to-square fa-2x text-primary action-icon"
                                        title="Edit"></i>
                                </td>
                                <td>
                                    <i onclick="onRemoveStd(this)"
                                        class="fa-solid fa-trash-can fa-2x text-danger action-icon" title="Remove"></i>
                                </td>
                            </tr>
                            <tr id="125">
                                <td>2</td>
                                <td>Suraj</td>
                                <td>Patil</td>
                                <td>98700524296</td>
                                <td>patilsuraj@gmail.com</td>
                                <td>
                                    <i onclick="onEditStd(this)"
                                        class="fa-solid fa-pen-to-square fa-2x text-primary action-icon"
                                        title="Edit"></i>
                                </td>

                                <td>
                                    <i onclick="onRemoveStd(this)"
                                        class="fa-solid fa-trash-can fa-2x text-danger action-icon" title="Remove"></i>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-content">
            <div class="spinner-border" role="status">
                <span class="sr-only">Loading...</span>
            </div>
            <div class="spinner-text">Please wait...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/app.js"></script>

</body>

</html>
